baseURL = 'https://waynemcknight.com/'
locale = 'en-us'
title = 'Wayne McKnight'
theme = 'PaperMod'
paginate = 10
enableRobotsTXT = true

[params]
  author = "Wayne McKnight"
  description = "Network Administrator | U.S. Navy Veteran | IT Professional"
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowFullTextinRSS = true
  ShowShareButtons = false
  ShowToc = true
  defaultTheme = "auto"
  disableScrollToTop = false

  [params.homeInfoParams]
    Title = "Wayne McKnight"
    Content = """
Network Administrator at Brenham ISD. U.S. Navy veteran. Former Colorado County IT Coordinator with 25+ years across government, law enforcement, healthcare, and education.

This is where I write about technology, networking, and whatever else is on my mind.
"""

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/waynemcknight-code"

  [[params.socialIcons]]
    name = "email"
    url = "mailto:wayne.mcknight@gmail.com"

  [params.assets]
    disableHLJS = false

[menu]
  [[menu.main]]
    name = "Blog"
    url = "/posts/"
    weight = 1
  [[menu.main]]
    name = "Resume"
    url = "/resume/"
    weight = 2
  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 3
  [[menu.main]]
    name = "Search"
    url = "/search/"
    weight = 4

[outputs]
  home = ["HTML", "RSS", "JSON"]
